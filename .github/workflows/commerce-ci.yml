name: Commerce CI

on:
  push:
    branches:
      - commerce-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript validation
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://art-to-ink.work.gd
