<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART TO INK — Galerie</title>
    <style>
        /* ZÁKLADNÍ STYL A DESIGN */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0b0b0b; color: #ffffff; padding: 40px 20px; }
        h1 { text-align: center; margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; }
        
        /* MŘÍŽKA GALERIE */
        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }
        
        /* KARTA PRODUKTU (Přední strana) */
        .product-card { 
            background: #161616; 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-card img { width: 100%; height: 350px; object-fit: cover; display: block; }
        .product-info { padding: 15px; text-align: center; }
        .product-title { font-size: 1.1rem; font-weight: 400; }

        /* VYSKAKOVACÍ OKNO (MODAL) */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .modal-content { 
            background: #161616; 
            max-width: 500px; 
            width: 100%; 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }
        .close-btn { 
            position: absolute; top: 15px; right: 20px; 
            font-size: 30px; color: white; cursor: pointer; z-index: 10; 
        }

        /* PREZENTACE OBRÁZKŮ (SLIDER) */
        .slider-container { position: relative; width: 100%; height: 400px; background: #000; }
        .slider-container img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .nav-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(0,0,0,0.6); color: white; border: none; 
            padding: 12px 16px; cursor: pointer; font-size: 18px; font-weight: bold;
        }
        .prev-btn { left: 10px; border-radius: 4px; }
        .next-btn { right: 10px; border-radius: 4px; }

        /* DETAILY A POKYNY K PLATBĚ */
        .modal-details { padding: 25px; }
        .modal-title { font-size: 1.4rem; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .payment-box { 
            background: #222; 
            padding: 15px; 
            border-left: 4px solid #fff; 
            border-radius: 4px; 
            margin-top: 15px; 
        }
        .payment-box h4 { margin-bottom: 8px; color: #aaa; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .payment-box p { font-size: 0.95rem; line-height: 1.5; color: #eee; }
    </style>
</head>
<body>

    <h1>ART TO INK</h1>
    
    <!-- Sem se automaticky vykreslí všechny motivy z dat níže -->
    <div class="gallery-grid" id="galleryGrid"></div>

    <!-- Vyskakovací okno pro detail produktu -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <!-- Prezentace dvou obrázků -->
            <div class="slider-container">
                <button class="nav-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>
                <img id="modalImg" src="" alt="Prezentace motivu">
                <button class="nav-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
            </div>
            
            <!-- Info a Pokyny k platbě -->
            <div class="modal-details">
                <h3 class="modal-title" id="modalTitle">Název motivu</h3>
                
                <div class="payment-box">
                    <h4>Pokyny k platbě</h4>
                    <p>Pro zakoupení tohoto motivu zašlete částku na účet: <b>123456789 / 0300</b>.<br>
                    Do poznámky pro příjemce uveďte <b>váš e-mail</b> a název motivu.<br>
                    Po připsání platby vám obratem zašleme soubory v plném rozlišení.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- SEZNAM PRODUKTŮ A CESTY K OBRÁZKŮM ---
        // Všechny obrázky máte nahrané ve složce "images" na GitHubu.
        // Koncovka "-1.jpg" se ukáže na hlavní zdi, po rozkliknutí se dá přepnout i na "-2.jpg".
        const products = [
            {
                id: 1,
                title: "Seahorses Grandparents",
                img1: "images/seahorses-grandparents-1.jpg",
                img2: "images/seahorses-grandparents-2.jpg"
            },
            {
                id: 2,
                title: "Assimilation",
                img1: "images/assimilation-1.jpg",
                img2: "images/assimilation-2.jpg"
            },
            {
                id: 3,
                title: "MRS Beer",
                img1: "images/mrs-beer-1.jpg",
                img2: "images/mrs-beer-2.jpg"
            }
        ];

        // --- VYGENEROVÁNÍ GALERIE NA WEBU ---
        const galleryGrid = document.getElementById('galleryGrid');
        
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.onclick = () => openModal(product);
            
            card.innerHTML = `
                <img src="${product.img1}" alt="${product.title}">
                <div class="product-info">
                    <div class="product-title">${product.title}</div>
                </div>
            `;
            galleryGrid.appendChild(card);
        });

        // --- OVLÁDÁNÍ PREZENTACE (SLIDERU) V MODALU ---
        let currentSlides = [];
        let currentSlideIndex = 0;

        function openModal(product) {
            const modal = document.getElementById('productModal');
            document.getElementById('modalTitle').innerText = product.title;
            
            // Nastavení obrázku 1 a obrázku 2 do prezentace
            currentSlides = [product.img1, product.img2];
            currentSlideIndex = 0;
            
            updateSlide();
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function changeSlide(direction) {
            currentSlideIndex += direction;
            if (currentSlideIndex >= currentSlides.length) currentSlideIndex = 0;
            if (currentSlideIndex < 0) currentSlideIndex = currentSlides.length - 1;
            updateSlide();
        }

        function updateSlide() {
            document.getElementById('modalImg').src = currentSlides[currentSlideIndex];
        }

        // Zavření okna kliknutím mimo obsah modalu
        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
